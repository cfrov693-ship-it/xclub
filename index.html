<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X Club</title>

<style>
body{
  margin:0;
  background:#0b0f14;
  font-family:Arial, sans-serif;
  color:#fff;
}

.wrap{
  max-width:400px;
  margin:100px auto;
  padding:20px;
  background:#111;
  border-radius:12px;
}

h2{
  text-align:center;
  margin-bottom:20px;
}

input{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  margin-bottom:15px;
  font-size:16px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  font-size:16px;
  font-weight:bold;
  background:#2ecc71;
  color:#fff;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="wrap">
  <h2>X Club 🔞</h2>

  <input id="pwd" type="password" placeholder="Parol daxil edin">
  <button type="button" onclick="checkPassword()">Daxil ol</button>
</div>

<script>
const PASS = "1234";  // burda parolu dəyişə bilərsən

function checkPassword(){
  const value = document.getElementById("pwd").value;

  if(value === PASS){
    localStorage.setItem("auth","1");

    // DÜZGÜN KEÇİD
    window.location.href = "v/K7la711kl/watch.html?v=" + Date.now();
  } else {
    alert("Parol səhvdir");
  }
}
</script>

</body>
</html>
